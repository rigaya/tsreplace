name: Build Linux Packages

on:
  push:
    branches:
      - linux
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      version_name:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerimg: ubuntu2004
            pkgtype: deb
            platform: amd64
            ffmpeg_arch: x64
            os: ubuntu-24.04
          - dockerimg: ubuntu2004
            pkgtype: deb
            platform: arm64
            ffmpeg_arch: arm64
            os: ubuntu-24.04-arm

    env:
      DOCKER_IMAGE: ${{ matrix.dockerimg }}
      PKG_TYPE: ${{ matrix.pkgtype }}
      BASE_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/tsreplace-build
      FFMPEG_PREFIX: /opt/build_scripts/ffmpeg_dll/tsreplace/${{ matrix.ffmpeg_arch }}/build

    name: Build package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare
        id: prep
        run: |
          NPROC=$(grep 'processor' /proc/cpuinfo | wc -l)
          OUTPUT_DIR=$(pwd)/output
          BASE_IMAGE="${{ env.BASE_IMAGE_REPO }}:${{ env.DOCKER_IMAGE }}-${{ matrix.platform }}"
          echo "base_image=${BASE_IMAGE}" >> $GITHUB_OUTPUT
          echo "nproc=${NPROC}" >> $GITHUB_OUTPUT
          echo "output_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT

      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          submodules: true
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ${{ steps.prep.outputs.base_image }}

      - name: Create output directory
        run: mkdir -p ${{ steps.prep.outputs.output_dir }}

      - name: Build package
        id: build_exec
        env:
          RELEASE_VERSION: ${{ inputs.version_name }}
        run: |
          docker run -dit --rm \
            -v ${{ github.workspace }}:/work \
            -v ${{ steps.prep.outputs.output_dir }}:/output \
            -u "$(id -u):$(id -g)" \
            --workdir /work \
            --name build_pkg ${{ steps.prep.outputs.base_image }}
          docker exec build_pkg bash -lc "PKG_CONFIG_PATH=${{ env.FFMPEG_PREFIX }}/lib/pkgconfig meson setup ./build . --buildtype=release -Db_lto=true -Dlibav_static=true -Dstatic_runtime=true"
          docker exec build_pkg bash -lc "meson compile -C ./build -j${{ steps.prep.outputs.nproc }}"
          VERSION_OUTPUT="$(docker exec build_pkg ./build/tsreplace --version)"
          echo "$VERSION_OUTPUT"
          if [[ -n "$RELEASE_VERSION" && "$VERSION_OUTPUT" != *" $RELEASE_VERSION "* ]]; then
            echo "ERROR: built version does not match release version $RELEASE_VERSION"
            exit 1
          fi
          docker exec build_pkg bash -lc "ldd ./build/tsreplace"
          docker exec build_pkg bash -lc "cp ./build/tsreplace ./tsreplace"
          docker exec build_pkg bash -lc "./build_${PKG_TYPE}.sh"
          docker exec build_pkg bash -lc "cp -v ./*.${PKG_TYPE} /output/"
          PKGFILE=$(ls ${{ steps.prep.outputs.output_dir }}/*.${{ env.PKG_TYPE }})
          echo "$PKGFILE"
          echo "pkgfile=$PKGFILE" >> $GITHUB_OUTPUT

      - name: Calculate hash
        run: |
          7z h -scrc* ${{ steps.build_exec.outputs.pkgfile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsreplace_${{ matrix.dockerimg }}_${{ matrix.pkgtype }}_${{ matrix.platform }}
          path: ${{ steps.build_exec.outputs.pkgfile }}
          if-no-files-found: error
          retention-days: 30
